[package]
name = "clipboard"
version = "0.1.0"
alya-version = "0.0.19"
entry = "src/lib.alya"
description = "Cross-platform clipboard toolkit: text, HTML, image, file list, history, watcher and sync for Alya"
authors = ["Alya Language Contributors <https://github.com/alya-lang>"]
license = "MIT"
homepage = "https://github.com/alya-lang/alya"
repository = "https://github.com/alya-lang/clipboard"
keywords = ["alya", "alya-lang", "package", "clipboard", "text", "html", "image", "audio", "files", "history", "watcher", "sync", "c", "ffi"]

[dependencies]

[features]
default = ["extras", "native"]
extras = []
native = []

[build]
c-sources = ["c/clipboard.c"]
c-sources-windows = ["c/win32_clipboard.c"]
c-sources-macos = ["c/cocoa_clipboard.c"]
c-sources-linux = ["c/linux_clipboard.c"]
c-flags = ["-O2"]
c-include-dirs = ["c"]
c-link-flags-windows = ["-luser32"]
c-link-flags-macos = ["-framework", "Foundation", "-framework", "AppKit"]
links = "clipboard"

